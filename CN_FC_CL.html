<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉语词卡 · ฝึกคำศัพท์จีน</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans Thai", "Noto Sans SC", sans-serif;
    background: radial-gradient(circle at 50% 0%, #7a1f1f 0%, #3d0f0f 70%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    color: #fff;
  }
  .pattern-bg {
    position: fixed; inset: 0;
    background-image: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0 2px, transparent 2px 40px),
                       repeating-linear-gradient(-45deg, rgba(212,175,55,0.05) 0 2px, transparent 2px 40px);
    pointer-events: none;
    z-index: 0;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
    z-index: 1;
  }
  header h1 {
    font-size: 2rem;
    color: #f5d76e;
    text-shadow: 0 0 10px rgba(245,215,110,0.5);
    letter-spacing: 2px;
  }
  header p { color: #f0c9c9; margin-top: 4px; font-size: 0.9rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
    z-index: 1;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:active { transform: scale(0.95); }
  .btn-gold {
    background: linear-gradient(135deg, #f5d76e, #d4af37);
    color: #5a1a1a;
    box-shadow: 0 4px 12px rgba(212,175,55,0.4);
  }
  .btn-outline {
    background: transparent;
    color: #f5d76e;
    border: 2px solid #f5d76e;
  }
  .btn-outline.active {
    background: #f5d76e;
    color: #5a1a1a;
  }

  .stage {
    perspective: 1200px;
    width: min(90vw, 380px);
    height: 260px;
    z-index: 1;
    margin-bottom: 20px;
  }
  .card {
    position: relative;
    width: 100%; height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    border: 3px solid #d4af37;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .face.front {
    background: linear-gradient(160deg, #a6272c, #7a1f1f);
  }
  .face.back {
    background: linear-gradient(160deg, #fdf6e3, #f0e2b6);
    color: #5a1a1a;
    transform: rotateY(180deg);
  }
  .hanzi { font-size: 3.2rem; font-weight: 700; color: #fff; }
  .pinyin { font-size: 1.2rem; color: #f5d76e; margin-top: 8px; }
  .meaning { font-size: 1.6rem; font-weight: 700; }
  .hint { font-size: 0.8rem; margin-top: 14px; opacity: 0.7; }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 1;
    margin-bottom: 14px;
  }
  .status-row {
    display: flex;
    gap: 10px;
    z-index: 1;
    margin-bottom: 10px;
  }
  .btn-known { background: #4caf50; color: #fff; }
  .btn-unknown { background: #e74c3c; color: #fff; }

  .progress {
    z-index: 1;
    font-size: 0.9rem;
    color: #f0c9c9;
    margin-bottom: 6px;
  }
  .stats {
    z-index: 1;
    font-size: 0.85rem;
    color: #f5d76e;
    display: flex;
    gap: 16px;
    margin-top: 6px;
  }
  #loading, #error {
    z-index: 1;
    text-align: center;
    padding: 40px;
    color: #f0c9c9;
  }
  #error { color: #ffb3b3; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="pattern-bg"></div>

<header>
  <h1>汉语词卡</h1>
  <p>ฝึกคำศัพท์ภาษาจีนด้วยแฟลชการ์ด</p>
</header>

<div id="loading">กำลังโหลดข้อมูลคำศัพท์... 🏮</div>
<div id="error" class="hidden"></div>

<div id="app" class="hidden">
  <div class="controls">
    <button class="btn-gold" id="shuffleBtn">🔀 สุ่มลำดับ</button>
    <button class="btn-outline" id="filterBtn">🔍 แสดงเฉพาะที่ยังไม่รู้</button>
  </div>

  <div class="progress" id="progress">1 / 1</div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="hanzi" id="hanzi">汉</div>
        <div class="pinyin" id="pinyin">hàn</div>
        <div class="hint">คลิกการ์ดเพื่อพลิกดูคำแปล</div>
      </div>
      <div class="face back">
        <div class="meaning" id="meaning">ความหมาย</div>
        <div class="hint">คลิกอีกครั้งเพื่อกลับด้าน</div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button class="btn-outline" id="prevBtn">◀ ก่อนหน้า</button>
    <button class="btn-gold" id="flipBtn">🔄 พลิกดูคำแปล</button>
    <button class="btn-outline" id="nextBtn">ถัดไป ▶</button>
  </div>

  <div class="status-row">
    <button class="btn-known" id="knownBtn">✔ จำได้แล้ว</button>
    <button class="btn-unknown" id="unknownBtn">✖ ยังไม่รู้</button>
  </div>

  <div class="stats">
    <span id="totalStat">ทั้งหมด: 0</span>
    <span id="knownStat">จำได้: 0</span>
    <span id="unknownStat">ยังไม่รู้: 0</span>
  </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPLNeVjdKjgiVZIgW3l5nc-T-lU1r7UGnaWTKeUGZHqr28X2DWUa1OLxJbLdTuBVpZ8GI4499iuWtF/pub?gid=0&single=true&output=csv";
const STORAGE_KEY = "chinese_flashcard_known_v1";

let allCards = [];
let workingList = [];
let currentIndex = 0;
let showOnlyUnknown = false;
let knownSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (field !== "" || row.length) { row.push(field); rows.push(row); }
        row = []; field = "";
        if (c === '\r' && next === '\n') i++;
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function hasCJK(str) { return /[\u4e00-\u9fff]/.test(str); }

function buildCards(rows) {
  if (!rows.length) return [];
  let startIdx = 0;
  // ตรวจว่าแถวแรกเป็น header หรือไม่ (ถ้าไม่มีตัวอักษรจีนในแถวแรก ให้ถือว่าเป็น header)
  const firstRow = rows[0];
  const looksLikeHeader = !firstRow.some(c => hasCJK(c));
  let colChinese = 0, colPinyin = 1, colMeaning = 2;

  if (looksLikeHeader) {
    startIdx = 1;
    const headers = firstRow.map(h => h.trim().toLowerCase());
    const findCol = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)));
    const cIdx = findCol(["chinese","hanzi","中文","word","汉字"]);
    const pIdx = findCol(["pinyin","拼音","phonetic"]);
    const mIdx = findCol(["meaning","thai","แปล","ความหมาย","translation"]);
    if (cIdx >= 0) colChinese = cIdx;
    if (pIdx >= 0) colPinyin = pIdx;
    if (mIdx >= 0) colMeaning = mIdx;
    else if (firstRow.length === 2) colMeaning = 1; // ไม่มีคอลัมน์ pinyin
  } else if (firstRow.length === 2) {
    colMeaning = 1; colPinyin = -1;
  }

  const cards = [];
  for (let i = startIdx; i < rows.length; i++) {
    const r = rows[i];
    const chinese = (r[colChinese] || "").trim();
    if (!chinese) continue;
    const pinyin = colPinyin >= 0 ? (r[colPinyin] || "").trim() : "";
    const meaning = (r[colMeaning] || "").trim();
    cards.push({ id: chinese + "_" + i, chinese, pinyin, meaning });
  }
  return cards;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function computeWorkingList() {
  let list = showOnlyUnknown ? allCards.filter(c => !knownSet.has(c.id)) : allCards;
  workingList = list;
  if (currentIndex >= workingList.length) currentIndex = 0;
}

function saveKnown() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...knownSet]));
}

function renderCard() {
  const card = document.getElementById("card");
  card.classList.remove("flipped");
  if (!workingList.length) {
    document.getElementById("hanzi").textContent = "🎉";
    document.getElementById("pinyin").textContent = "";
    document.getElementById("meaning").textContent = "ไม่มีคำในหมวดนี้แล้ว";
    document.getElementById("progress").textContent = "0 / 0";
    updateStats();
    return;
  }
  const c = workingList[currentIndex];
  document.getElementById("hanzi").textContent = c.chinese;
  document.getElementById("pinyin").textContent = c.pinyin;
  document.getElementById("meaning").textContent = c.meaning || "(ไม่มีคำแปล)";
  document.getElementById("progress").textContent = `${currentIndex + 1} / ${workingList.length}`;
  updateStats();
}

function updateStats() {
  const total = allCards.length;
  const known = allCards.filter(c => knownSet.has(c.id)).length;
  document.getElementById("totalStat").textContent = `ทั้งหมด: ${total}`;
  document.getElementById("knownStat").textContent = `จำได้: ${known}`;
  document.getElementById("unknownStat").textContent = `ยังไม่รู้: ${total - known}`;
}

document.getElementById("card").addEventListener("click", () => {
  document.getElementById("card").classList.toggle("flipped");
});
document.getElementById("flipBtn").addEventListener("click", () => {
  document.getElementById("card").classList.toggle("flipped");
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (!workingList.length) return;
  currentIndex = (currentIndex + 1) % workingList.length;
  renderCard();
});
document.getElementById("prevBtn").addEventListener("click", () => {
  if (!workingList.length) return;
  currentIndex = (currentIndex - 1 + workingList.length) % workingList.length;
  renderCard();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  workingList = shuffleArray(workingList);
  currentIndex = 0;
  renderCard();
});
document.getElementById("filterBtn").addEventListener("click", (e) => {
  showOnlyUnknown = !showOnlyUnknown;
  e.target.classList.toggle("active", showOnlyUnknown);
  e.target.textContent = showOnlyUnknown ? "📚 แสดงทั้งหมด" : "🔍 แสดงเฉพาะที่ยังไม่รู้";
  currentIndex = 0;
  computeWorkingList();
  renderCard();
});
document.getElementById("knownBtn").addEventListener("click", () => {
  if (!workingList.length) return;
  knownSet.add(workingList[currentIndex].id);
  saveKnown();
  if (showOnlyUnknown) { computeWorkingList(); }
  else currentIndex = Math.min(currentIndex + 1, workingList.length - 1);
  renderCard();
});
document.getElementById("unknownBtn").addEventListener("click", () => {
  if (!workingList.length) return;
  knownSet.delete(workingList[currentIndex].id);
  saveKnown();
  currentIndex = Math.min(currentIndex + 1, workingList.length - 1);
  renderCard();
});

async function init() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    allCards = buildCards(rows);
    if (!allCards.length) throw new Error("ไม่พบข้อมูลคำศัพท์ในไฟล์ CSV");
    computeWorkingList();
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    renderCard();
  } catch (err) {
    document.getElementById("loading").classList.add("hidden");
    const errEl = document.getElementById("error");
    errEl.classList.remove("hidden");
    errEl.textContent = "โหลดข้อมูลไม่สำเร็จ: " + err.message + " (ตรวจสอบว่าลิ้งก์ Publish to web ยังใช้งานได้ และเปิดผ่านเว็บเซิร์ฟเวอร์ ไม่ใช่ไฟล์ในเครื่องโดยตรง)";
  }
}
init();
</script>
</body>
</html>
